<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mummy Project</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../projectstyle.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .custom-layout { display: flex; flex-direction: column; gap: 20px; width: 100%; }
    .full-width-row img, .full-width-row video, .image-row img {
      width: 100%; display: block; height: auto; border-radius: 4px; cursor: pointer;
    }
    .extra-description {
      text-align: center; margin: 40px auto; display: block; width: 100%; max-width: 900px; line-height: 1.6;
    }

    /* Lightbox Styles */
    #lightbox {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.95); display: flex; align-items: center;
      justify-content: center; z-index: 2000;
    }
    #lightbox-img, #lightbox-video {
      max-width: 90vw; max-height: 80vh; border-radius: 4px; display: block;
    }
    .hidden { display: none !important; }
    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 3rem; color: white; background: none; border: none; cursor: pointer; padding: 20px;
    }
    #prev-img { left: 10px; }
    #next-img { right: 10px; }
    #lightbox-close {
      position: absolute; top: 20px; right: 30px; font-size: 3rem;
      background: none; border: none; color: white; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="project-container">
    <div class="title-desc-wrapper">
      <div class="left-column">
        <h1 class="project-title">Mummy</h1>
        <div class="software-icons" id="software-icons"></div>
      </div>
      <div class="right-column">
        <p class="project-description" id="project-description"></p>
      </div>
    </div>

    <div id="image-gallery" class="custom-layout">
      <div class="full-width-row">
        <img src="images/image1.png" alt="Mummy Artwork 1" class="lightbox-trigger">
      </div>

      <p class="extra-description">
        The artwork in Mummy is all handled by me. From concepting to modeling, texturing, and lighting.
      </p>

      <div class="full-width-row">
        <video autoplay loop muted playsinline preload="auto" class="lightbox-trigger">
          <source src="images/montage.mp4" type="video/mp4">
          <source src="images/montage.webm" type="video/webm">
        </video>
      </div>

      <div id="dynamic-images"></div>
    </div>

    <p id="closing-text" class="extra-description"></p>

    <div id="lightbox" class="hidden">
        <button id="lightbox-close">&times;</button>
        <button id="prev-img" class="nav-btn">&#8249;</button>
        
        <img id="lightbox-img" src="" class="hidden" />
        
        <video id="lightbox-video" controls playsinline loop muted class="hidden">
            <p>Your browser does not support HTML5 video.</p>
        </video>
        
        <button id="next-img" class="nav-btn">&#8250;</button>
    </div>
  </main>

  <script type="module">
    // 1. Setup Navbar
    fetch('../../components/navbar.html').then(res => res.text()).then(html => document.getElementById('navbar-container').innerHTML = html);

    const slug = 'mummy'; 
    let galleryItems = []; 
    let currentIndex = 0;

    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    const lbVid = document.getElementById('lightbox-video');

    // 2. Fetch Project Data
    fetch('../../assets/projects.json').then(res => res.json()).then(projects => {
      const project = projects.find(p => p.slug === slug);
      if (project) {
        document.getElementById('project-description').textContent = project.description || '';
        document.getElementById('closing-text').textContent = project.closing || '';

        const iconContainer = document.getElementById('software-icons');
        (project.programs || []).forEach(prog => {
          const img = document.createElement('img');
          img.src = `../../assets/programs/${prog}.png`;
          iconContainer.appendChild(img);
        });

        const dynamicContainer = document.getElementById('dynamic-images');
        project.rows.forEach(row => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'image-row';
          rowDiv.style.display = 'grid';
          rowDiv.style.gridTemplateColumns = `repeat(${row.columns}, 1fr)`;
          rowDiv.style.gap = '20px';
          rowDiv.style.marginBottom = '20px';
          
          row.images.forEach(imgPath => {
            if (imgPath.includes('image1.png')) return;
            const img = document.createElement('img');
            img.src = imgPath;
            img.className = 'lightbox-trigger';
            rowDiv.appendChild(img);
          });
          dynamicContainer.appendChild(rowDiv);
        });
      }
      initializeLightbox();
    });

    // 3. Robust Lightbox Initialization
    function initializeLightbox() {
      const triggers = document.querySelectorAll('.lightbox-trigger');
      galleryItems = [];

      triggers.forEach((el, index) => {
        if (el.tagName === 'IMG') {
          galleryItems.push({ type: 'img', content: el.src });
        } else if (el.tagName === 'VIDEO') {
          // CLONING METHOD: Store the actual source elements to preserve MIME types
          galleryItems.push({ 
            type: 'video', 
            content: el.innerHTML, // Captures all <source> tags
            poster: el.getAttribute('poster') || '' 
          });
        }
        el.onclick = () => openLightbox(index);
      });
    }

    function openLightbox(index) {
      currentIndex = index;
      const item = galleryItems[currentIndex];

      // Reset
      lbImg.classList.add('hidden');
      lbVid.classList.add('hidden');
      lbVid.pause();
      lbVid.innerHTML = ""; // Clear old sources
      lbVid.removeAttribute('src'); // Clear direct src if any

      if (item.type === 'img') {
        lbImg.src = item.content;
        lbImg.classList.remove('hidden');
      } else {
        // Inject the cloned sources
        lbVid.innerHTML = item.content; 
        lbVid.classList.remove('hidden');
        
        // Critical for Safari & Firefox: Load and Play
        lbVid.load(); 
        
        // Browsers block autoplay with sound. We use muted by default, 
        // but try to play and handle errors gracefully.
        const playPromise = lbVid.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.log("Autoplay blocked, user must click play.");
          });
        }
      }
      
      lightbox.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    // 4. Controls
    const closeLB = () => {
      lightbox.classList.add('hidden');
      lbVid.pause();
      lbVid.innerHTML = ""; // Stop network activity
      document.body.style.overflow = 'auto';
    };

    document.getElementById('lightbox-close').onclick = closeLB;
    document.getElementById('next-img').onclick = (e) => {
      e.stopPropagation();
      currentIndex = (currentIndex + 1) % galleryItems.length;
      openLightbox(currentIndex);
    };
    document.getElementById('prev-img').onclick = (e) => {
      e.stopPropagation();
      currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
      openLightbox(currentIndex);
    };

    lightbox.onclick = (e) => { if (e.target === lightbox) closeLB(); };

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (lightbox.classList.contains('hidden')) return;
      if (e.key === "Escape") closeLB();
      if (e.key === "ArrowRight") document.getElementById('next-img').click();
      if (e.key === "ArrowLeft") document.getElementById('prev-img').click();
    });
  </script>
</body>
</html>
