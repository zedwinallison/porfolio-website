<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zach Allison Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="projectstyle.css">

  <style>
    .project-gallery {
      padding-top: 7px !important;
    }
    
    .sketchfab-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      padding: 0 0px;
      margin-bottom: 60px;
    }

    .sketchfab-embed-wrapper iframe {
      width: 100%;
      border: none;
      border-radius: 0; 
    }

    #work-preview {
      margin-top: 0px;
      padding-top: 40px;
    }

    .work-preview {
      padding-top: 30px;
      margin-top: 30px;
    }
    
    .image-row {
      display: flex;
      gap: 30px;
      padding: 0 0px;
      margin-bottom: 40px;
    }

    .image-row img {
      width: 50%;
      border-radius: 0; 
    }

    .launch-button {
      display: block;
      margin: 0 auto 60px;
      padding: 14px 30px;
      font-size: 1.2rem;
      background-color: black;
      color: white;
      text-decoration: none;
      border-radius: 10px; 
      transition: background-color 0.3s;
      text-align: center;
      width: fit-content;
    }

    .launch-button:hover {
      background-color: #222;
    }

    /* --- MOBILE RESPONSIVENESS --- */
    @media (max-width: 768px) {
      /* Navbar Reset for iPhone Centering */
      #navbar, #navbar * {
        box-sizing: border-box !important;
        padding-left: 0 !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
      }

      #navbar nav, .navbar {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        text-align: center !important;
        width: 100vw !important;
        padding: 20px 0 !important;
        gap: 20px !important;
      }

      #navbar ul, .nav-links {
        display: flex !important;
        justify-content: center !important;
        gap: 20px !important;
        padding: 0 !important;
        list-style: none !important;
        width: 100% !important;
      }

      /* FIXED: Force Project Gallery to one column */
      #project-grid {
        grid-template-columns: 1fr !important; /* Stack thumbnails */
        padding: 0 10px;
      }

      /* FIXED: Center and stack Video Grid to one column */
      .video-grid {
        grid-template-columns: 1fr !important;
        padding: 0 10px;
        align-items: center;
        justify-items: center;
      }

      .video-wrapper {
        width: 100% !important;
        max-width: 500px; /* Prevents videos from getting too massive on mobile */
        margin: 0 auto;
        padding: 10px 0 !important;
        text-align: center;
      }

      /* Keep title wrapper logic clean */
      .title-desc-wrapper {
        flex-direction: column;
        gap: 10px;
        max-width: 100%;
      }

      .project-description {
        max-width: 100%;
      }

      .software-icons-wrapper {
        margin-top: 0;
        margin-bottom: 20px;
      }

      .sketchfab-grid {
        grid-template-columns: 1fr;
        padding: 0 10px;
      }

      .image-row {
        flex-direction: column;
        padding: 0 10px;
      }

      .image-row img {
        width: 100%;
      }
    }

    /* Video Section Styles */
    .video-section {
      margin-top: 60px;
      margin-bottom: 60px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 0 10px;
    }

    .video-wrapper {
      padding: 10px;
      box-sizing: border-box;
    }

    .video-aspect-ratio {
      position: relative;
      width: 100%;
      padding-top: 56.25%; 
      background: #000;
      border-radius: 6px;
      overflow: hidden;
    }

    .video-aspect-ratio iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .unity-wrapper {
      width: 100%;
      height: 70vh; 
    }

    .unity-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh; 
      overflow: hidden;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover; 
    }

    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg); 
      width: 24px;
      height: 24px;
      border-bottom: 4px solid rgb(255, 255, 255);
      border-right: 4px solid rgb(255, 255, 255);
      background: transparent;   
      cursor: pointer;
      animation: hover 2s ease-in-out infinite;
      user-select: none;
    }

    @keyframes hover {
      0%   { transform: translate(-50%, 0) rotate(45deg); }
      50%  { transform: translate(-50%, -6px) rotate(45deg); }
      100% { transform: translate(-50%, 0) rotate(45deg); }
    }
  </style>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js",
        "GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/loaders/GLTFLoader.js"
      }
    }
  </script>
</head>
<body>
  <div id="navbar"></div>

  <script>
    fetch('/components/navbar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('navbar').innerHTML = data;
      });
  </script>

  <section class="hero">
    <img src="assets/hero.png" alt="Hero Image" class="hero-image">
    <div class="scroll-indicator" id="scroll-indicator"></div>
  </section>

  <section id="work-preview">
    <div class="grid" id="project-grid"></div>
    <a href="projects.html" class="see-more-button" style="display: block; margin: 0 auto; margin-top: 20px;">
      See More Projects →
    </a>
  </section>

  <script type="module">
    async function loadProjects() {
      const response = await fetch('assets/projects.json');
      const projects = await response.json();
      const grid = document.getElementById('project-grid');

      projects.slice(0, 8).forEach(project => {
        const link = document.createElement('a');
        link.href = `projects/${project.slug}/`;

        const item = document.createElement('div');
        item.className = 'grid-item';

        const img = document.createElement('img');
        img.src = project.thumbnail;
        img.alt = project.title;

        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.textContent = project.title;

        item.appendChild(img);
        item.appendChild(overlay);
        link.appendChild(item);
        grid.appendChild(link);
      });
    }
    loadProjects();
  </script>

  <section class="video-section">
    <div class="video-grid">
      <div class="video-wrapper">
        <div class="video-aspect-ratio">
          <iframe src="https://drive.google.com/file/d/1EP-55wR_GIuLm3rwX4QEbZBntHG44qCZ/preview" allow="autoplay" allowfullscreen></iframe>
        </div>
        <a href="projects/blender-day-1-tutorial/index.html" class="see-more-button">See Project →</a>
      </div>

      <div class="video-wrapper">
        <div class="video-aspect-ratio">
          <iframe src="https://drive.google.com/file/d/10fb8MQjdg1hwFwx0rZkZnzDPLPP2z-Ik/preview" allow="autoplay" allowfullscreen></iframe>
        </div>
        <a href="projects/title-card/index.html" class="see-more-button">See Project →</a>
      </div>

      <div class="video-wrapper">
        <div class="video-aspect-ratio">
          <iframe src="https://drive.google.com/file/d/1cEUl6vZ45U0bBiIxxrBFb33vLz-mLNKa/preview" allow="autoplay" allowfullscreen></iframe>
        </div>
        <a href="projects/state-parks-videos/index.html" class="see-more-button">See Project →</a>
      </div>
    </div>
  </section>

  <script>
    document.getElementById("scroll-indicator").addEventListener("click", () => {
      document.getElementById("work-preview").scrollIntoView({ 
        behavior: "smooth" 
      });
    });
  </script>
</body>
</html>
